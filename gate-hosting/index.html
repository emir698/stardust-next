<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stardust Gate — Güncelleme</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #ededed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #141414;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }
    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: .05em;
      color: #fff;
      margin-bottom: 4px;
    }
    .sub {
      font-size: 11px;
      letter-spacing: .2em;
      color: #555;
      margin-bottom: 32px;
    }
    .version-box {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .version-label {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: 4px;
    }
    .version-num {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      font-family: monospace;
    }
    .version-date {
      font-size: 11px;
      color: #555;
      margin-top: 2px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: #fff;
      color: #000;
      font-size: 15px;
      font-weight: 700;
      border-radius: 10px;
      text-decoration: none;
      margin-bottom: 12px;
      transition: background .15s;
    }
    .btn:active { background: #ddd; }
    .note {
      font-size: 11px;
      color: #444;
      line-height: 1.6;
      margin-top: 20px;
    }
    .note b { color: #666; }
    .steps {
      text-align: left;
      background: #1a1a1a;
      border-radius: 10px;
      padding: 14px 16px;
      margin-top: 16px;
      font-size: 12px;
      color: #666;
      line-height: 2;
    }
    .steps span { color: #999; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">STARDUST</div>
    <div class="sub">GATE</div>

    <div class="version-box">
      <div class="version-label">Mevcut Sürüm</div>
      <div class="version-num" id="ver">—</div>
      <div class="version-date" id="date">—</div>
    </div>

    <a class="btn" href="stardust-gate.apk" download="stardust-gate.apk">
      ⬇ APK İndir
    </a>

    <div class="steps">
      <span>1.</span> APK İndir butonuna bas<br>
      <span>2.</span> İndirme tamamlanınca "Aç" de<br>
      <span>3.</span> "Yine de yükle" → "Yükle" de<br>
      <span>4.</span> İlk seferde "bilinmeyen kaynak" izni isteyecek — izin ver
    </div>

    <div class="note">
      Kurulum sonrası giriş bilgilerin korunur.<br>
      Sorun olursa <b>önce kaldır, sonra tekrar yükle.</b>
    </div>
  </div>

  <script>
    // version.json dosyasından sürüm bilgisini çek
    fetch('version.json')
      .then(r => r.json())
      .then(d => {
        document.getElementById('ver').textContent = d.version || '—';
        document.getElementById('date').textContent = d.date || '';
      })
      .catch(() => {
        document.getElementById('ver').textContent = 'Mevcut';
      });
  </script>
</body>
</html>
