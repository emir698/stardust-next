name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Show project structure
        run: |
          echo "=== settings.gradle ==="
          cat android/settings.gradle
          echo "=== build.gradle (root) ==="
          cat android/build.gradle
          echo "=== app/build.gradle ==="
          cat android/app/build.gradle
          echo "=== Gradle version ==="
          cd android && ./gradlew --version

      - name: Build Debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m"

      - name: Show build log on failure
        if: failure()
        run: |
          echo "## Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          tail -300 /tmp/build.log >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "---LAST 50 LINES---"
          tail -50 /tmp/build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stardust-scan-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
