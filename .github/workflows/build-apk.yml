name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        id: gradle_build
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle-build.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m"
        continue-on-error: true

      - name: Commit build log to repo
        if: always()
        run: |
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          mkdir -p ci-logs
          cp /tmp/gradle-build.log ci-logs/last-build.log 2>/dev/null || echo "No log" > ci-logs/last-build.log
          git add ci-logs/last-build.log
          git diff --staged --quiet || git commit -m "ci: build log run ${{ github.run_number }}" --allow-empty
          git push

      - name: Upload APK
        if: steps.gradle_build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: stardust-scan-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Fail if build failed
        if: steps.gradle_build.outputs.exit_code != '0'
        run: |
          echo "Build failed. Check ci-logs/last-build.log in repo"
          exit 1
