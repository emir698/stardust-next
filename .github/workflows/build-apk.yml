name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle-build.log; PIPESTATUS_VAL=${PIPESTATUS[0]}; echo "BUILD_EXIT_CODE=${PIPESTATUS_VAL}" >> $GITHUB_ENV
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m"
        continue-on-error: true

      - name: PRINT FULL BUILD LOG
        if: always()
        run: |
          echo "============ GRADLE BUILD LOG START ============"
          cat /tmp/gradle-build.log 2>/dev/null || echo "No log file found"
          echo "============ GRADLE BUILD LOG END ============"
          echo "Build exit code was: ${BUILD_EXIT_CODE}"

      - name: Upload APK (if success)
        if: env.BUILD_EXIT_CODE == '0'
        uses: actions/upload-artifact@v4
        with:
          name: stardust-scan-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Fail if build failed
        if: env.BUILD_EXIT_CODE != '0'
        run: |
          echo "Build failed with exit code ${BUILD_EXIT_CODE}"
          exit 1
