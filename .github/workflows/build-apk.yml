name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle-build.log; echo "EXIT:${PIPESTATUS[0]}" >> /tmp/gradle-build.log
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m"
        continue-on-error: true

      - name: Check build result and show log
        run: |
          LAST=$(tail -1 /tmp/gradle-build.log)
          echo "Last line: $LAST"
          if echo "$LAST" | grep -q "EXIT:0"; then
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
            echo "✅ Build succeeded"
          else
            echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
            echo "❌ Build failed - showing last 150 lines:"
            echo "---"
            tail -150 /tmp/gradle-build.log
            echo "---"
            # Also write to summary
            echo "## Build Failed - Gradle Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -200 /tmp/gradle-build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          retention-days: 7

      - name: Upload APK (if build succeeded)
        if: env.BUILD_SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stardust-scan-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Fail job if build failed
        if: env.BUILD_SUCCESS == 'false'
        run: exit 1
